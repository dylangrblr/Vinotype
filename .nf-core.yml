repository_type: pipeline

nf_core_version: 3.2.1

lint:
  files_unchanged:
    - .prettierignore
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-vinotype_logo_light.png
    - docs/images/nf-core-vinotype_logo_light.png
    - docs/images/nf-core-vinotype_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-vinotype_logo_light.png
    - docs/images/nf-core-vinotype_logo_light.png
    - docs/images/nf-core-vinotype_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: dylangrblr
  name: vinotype
  description: A streamlined computational framework geared towards the effective,
    large-scale identification of sequence variants from Illumina short-read data
    for grapevine (Vitis spp.)
  author: '@dylangrblr,@abhi18av'
  version: 1.0.0dev
  force: true
  outdir: collab-sun-dylan-vinotype
  skip_features:
    - igenomes
    - gitpod
    - slackreport
  is_nfcore: false
